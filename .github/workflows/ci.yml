name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  manifests:
    name: manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: kubectl kustomize . > /dev/null
      - run: python3 -c 'import json; json.load(open("deploy/k8s/config.json"))'
      - run: |
          pipx run yamllint==1.37.1 -d '{rules: {key-duplicates: enable}}' .
